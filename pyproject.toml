[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mycoprimer"
version = "2.0.0"
description = "FISH probe design studio: smFISH / smiFISH / HCR 3.0 / SNAIL with host-genome filtering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "J" }]
dependencies = [
  "streamlit>=1.49",
  "pandas>=2.0",
  "numpy>=1.24",
  "biopython>=1.83",
  "primer3-py>=2.0",
  "plotly>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mycoprimer = "mycoprimer.__main__:main"
mycoprimer-batch = "mycoprimer.batch:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["mycoprimer", "mycoprimer.schemes"]

[tool.setuptools.package-data]
mycoprimer = ["config_default.toml"]
